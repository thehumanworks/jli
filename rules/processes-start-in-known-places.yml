id: processes-start-in-known-places
language: rust
severity: error
message: Commands are started only by src/exec.rs (the user's steps, and ps to find the calling shell), src/context.rs (git facts) and src/demo.rs.
rule:
  pattern: Command::new($$$ARGS)
ignores:
  - src/exec.rs
  - src/context.rs
  - src/demo.rs
  # Offline integration tests must start the built CLI to verify persistence across processes.
  - tests/bindings.rs
