id: http-stays-in-llm
language: rust
severity: error
message: Every language model request goes through the one HTTP call in src/llm.rs (ADR 4).
rule:
  kind: scoped_identifier
  regex: ^ureq
ignores:
  - src/llm.rs
  # chatgpt-sdk is a library of its own, with its own HTTP seam (ADR 28).
  - crates/**
